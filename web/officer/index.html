<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1F44">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Guard Pro">
<title>Guard Pro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
[hidden]{display:none!important}
:root{--navy:#0A1F44;--gold:#C9A227;--bg:#F3F4F7;--surface:#fff;--surface-2:#EBEEF4;--line:#D8DCE6;--text:#131C33;--muted:#5D6780;--ok:#2C7A5B;--ok-bg:#E3F2EA;--warn:#A86D0E;--warn-bg:#FBF1DC;--bad:#B3261E;--bad-bg:#FBE9E7;--info:#2B5FAF;--info-bg:#E4ECFA}
@media (prefers-color-scheme:dark){:root{--bg:#0D1526;--surface:#142038;--surface-2:#1B2A48;--line:#26324D;--text:#E8ECF4;--muted:#9AA6BF;--ok:#7FD3AE;--ok-bg:#15352A;--warn:#E6B45A;--warn-bg:#3A2E14;--bad:#F28B82;--bad-bg:#3A1E1C;--info:#8FB4F0;--info-bg:#1A2B4D}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Barlow,system-ui,sans-serif;font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;padding-bottom:calc(env(safe-area-inset-bottom) + 64px)}
.top{background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
.brand{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:22px;letter-spacing:.06em;text-transform:uppercase}.brand b{color:var(--gold)}
.top .who{margin-left:auto;font-size:13px;opacity:.85;text-align:right;line-height:1.2}
.top .who button{background:none;border:0;color:#fff;text-decoration:underline;font-size:12px;padding:0}
.bell{background:none;border:0;color:#fff;font-size:18px;position:relative;padding:4px}
.badge{position:absolute;top:-2px;right:-4px;background:var(--gold);color:#1a1400;border-radius:9px;font-size:10px;font-weight:700;padding:1px 5px}
main{padding:12px 12px 24px;max-width:560px;margin:0 auto}
h2{font-family:"Barlow Condensed",sans-serif;font-size:18px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 4px 6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(10,31,68,.06)}
.card.now{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.card .site{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:21px;line-height:1.1}
.card .post{color:var(--muted);margin-top:2px}
.card .time{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;margin:8px 0 2px}
.card .meta{font-size:13px;color:var(--muted)}
.pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);margin:0 4px 4px 0}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.info{background:var(--info-bg);color:var(--info)}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{flex:1;min-width:110px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:13px 12px;font:inherit;font-weight:600;font-size:16px;text-align:center;text-decoration:none}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1a1400}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5}
.btn.small{flex:0 0 auto;min-width:0;padding:8px 12px;font-size:14px;font-weight:500}
details{margin-top:10px}summary{cursor:pointer;color:var(--info);font-weight:500}
.orders{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:10px;margin-top:8px;font-size:15px}
.msg{padding:10px 12px;border-radius:8px;font-size:14px;margin:8px 0}
.msg.ok{background:var(--ok-bg);color:var(--ok)}.msg.bad{background:var(--bad-bg);color:var(--bad)}.msg.info{background:var(--info-bg);color:var(--info)}.msg.warn{background:var(--warn-bg);color:var(--warn)}
.login{max-width:420px;margin:40px auto;padding:0 16px}
.login h1{font-family:"Barlow Condensed",sans-serif;font-size:30px;margin:0 0 4px}
.login p{color:var(--muted);margin:0 0 16px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:13px;color:var(--muted)}
.field input,.field select,.field textarea{font:inherit;font-size:17px;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{text-align:center;color:var(--muted);padding:40px 12px}
.day{font-family:"Barlow Condensed",sans-serif;font-size:17px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:18px 4px 6px}
.day.today{color:var(--text)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 76px);transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;z-index:20}
.toast.show{opacity:1}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav.tabs button{flex:1;background:none;border:0;padding:10px 4px 8px;font:inherit;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav.tabs button span.i{font-size:20px}
nav.tabs button.on{color:var(--navy)}@media (prefers-color-scheme:dark){nav.tabs button.on{color:var(--gold)}}
nav.tabs .badge{top:4px;right:calc(50% - 22px)}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:10;overflow:auto;padding-bottom:40px}
.sheet .bar{position:sticky;top:0;background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;display:flex;align-items:center;gap:10px;z-index:2}
.sheet .bar h3{margin:0;font-family:"Barlow Condensed",sans-serif;font-size:20px;flex:1}
.sheet .bar button{background:none;border:0;color:#fff;font-size:22px;padding:0 6px}
.sheet .in{padding:12px;max-width:560px;margin:0 auto}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.item .t{font-weight:600}.item .s{font-size:13px;color:var(--muted)}
.photos{display:flex;gap:6px;flex-wrap:wrap}.photos img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
video{width:100%;border-radius:10px;background:#000}
.slot{display:flex;gap:8px;align-items:center;font-size:14px;padding:6px 0;border-bottom:1px solid var(--line)}
.checkin{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 70px);background:var(--gold);color:#1a1400;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:8}
.checkin b{flex:1}
.checkin button{border:0;background:var(--navy);color:#fff;border-radius:8px;padding:10px 14px;font:inherit;font-weight:600}
</style>
</head>
<body>
<header class="top"><div class="brand">Guard <b>Pro</b></div><button class="bell" id="bell" hidden>🔔<span class="badge" id="bellbadge" hidden></span></button><div class="who" id="who"></div></header>
<main id="main"><div class="empty">Loading…</div></main>
<nav class="tabs" id="tabs" hidden>
  <button data-tab="shifts" class="on"><span class="i">📅</span>My shifts</button>
  <button data-tab="open"><span class="i">🟢</span>Open shifts<span class="badge" id="openbadge" hidden></span></button>
  <button data-tab="requests"><span class="i">✉️</span>Requests</button>
  <button data-tab="more"><span class="i">☰</span>More</button>
</nav>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DAY=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const parseLocal=s=>{const [d,t='00:00']=s.split('T');const [y,m,da]=d.split('-').map(Number);const [h,mi]=t.split(':').map(Number);return new Date(y,m-1,da,h,mi);};
const t12=s=>{const [h,mi]=s.slice(11,16).split(':').map(Number);return (h%12||12)+':'+pad(mi)+(h<12?'am':'pm')};
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const fmtAt=iso=>{if(!iso)return '';const d=new Date(iso);return (d.getHours()%12||12)+':'+pad(d.getMinutes())+(d.getHours()<12?'am':'pm');};
const fmtDate=ds=>{const d=parseLocal(ds);return DAY[d.getDay()].slice(0,3)+' '+MON[d.getMonth()]+' '+d.getDate();};
function addDays(ds,n){const d=parseLocal(ds);d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),3200);}
async function api(method,path,body){const r=await fetch(path,{method,credentials:'same-origin',headers:{'content-type':'application/json'},body:body?JSON.stringify(body):undefined});const j=await r.json().catch(()=>({}));if(r.status===401&&S.user){S.user=null;renderLogin();}if(!r.ok)throw new Error(j.error||r.statusText);return j;}
const geo=()=>new Promise(res=>{if(!navigator.geolocation)return res(null);navigator.geolocation.getCurrentPosition(p=>res(p.coords),()=>res(null),{enableHighAccuracy:true,timeout:12000,maximumAge:30000});});
const S={user:null,data:null,phone:'',tab:'shifts',open:null,reqs:null,notes:{unread:0,notifications:[]},lone:null,runsheet:null,rsShift:null,crumbTimer:null};

/* ---------- start / login ---------- */
async function start(){
  try{const me=await api('GET','/api/me');S.user=me.user;}catch(e){S.user=null;}
  if(!S.user)return renderLogin();
  if(S.user.role!=='officer'){location.href=S.user.role==='client'?'/client/':'/dispatch/';return;}
  $('#tabs').hidden=false;$('#bell').hidden=false;
  await load();loadNotes();
  setInterval(load,60000);setInterval(loadNotes,60000);setInterval(pollLone,60000);
  try{const es=new EventSource('/api/events');es.addEventListener('change',ev=>{const d=JSON.parse(ev.data);if(d.type==='notify'&&d.scope==='emp:'+S.user.employeeId){loadNotes();}if(d.type==='week'||d.type==='requests')load();});}catch(e){}
}
async function load(){try{S.data=await api('GET','/api/officer/shifts');if(S.tab==='shifts')render();pollLone();}catch(e){if(S.user)toast(e.message);}}
async function loadNotes(){try{S.notes=await api('GET','/api/notifications');const b=$('#bellbadge');b.hidden=!S.notes.unread;b.textContent=S.notes.unread;}catch(e){}}
function renderLogin(step){
  $('#tabs').hidden=true;$('#bell').hidden=true;$('#who').innerHTML='';
  $('#main').innerHTML=`<div class="login"><h1>Officer sign in</h1><p>${step==='code'?'We sent a 6-digit code to '+esc(S.phone)+'.':'Use the mobile number dispatch has on file for you.'}</p>
  <form id="lf">${step==='code'?`<div class="field"><label>Code</label><input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required autofocus></div>`:`<div class="field"><label>Mobile number</label><input name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="617-555-0100" required autofocus></div>`}
  <div class="msg bad" id="lmsg" hidden></div><button class="btn primary" type="submit" style="width:100%">${step==='code'?'Sign in':'Text me a code'}</button>
  ${step==='code'?'<div style="text-align:center;margin-top:10px"><button type="button" class="btn small" id="back">Use a different number</button></div>':''}</form></div>`;
  $('#lf').addEventListener('submit',async e=>{e.preventDefault();const f=e.target;const m=$('#lmsg');m.hidden=true;
    try{if(step==='code'){await api('POST','/api/auth/verify',{phone:S.phone,code:f.code.value.trim()});await start();}
      else{S.phone=f.phone.value.trim();const r=await api('POST','/api/auth/request-code',{phone:S.phone});renderLogin('code');if(r.devCode){const m2=document.createElement('div');m2.className='msg info';m2.textContent='Texting is not set up yet on this server. Your code is '+r.devCode;$('#lf').prepend(m2);}}
    }catch(err){m.textContent=err.message;m.hidden=false;}});
  const b=$('#back');if(b)b.onclick=()=>renderLogin();
}

/* ---------- tabs ---------- */
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(!b)return;S.tab=b.dataset.tab;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));render();});
function render(){
  if(!S.data)return;
  $('#who').innerHTML=`<div>${esc(S.data.employee.name)}</div><button id="out">Sign out</button>`;$('#out').onclick=async()=>{await api('POST','/api/auth/logout');location.reload();};
  if(S.tab==='shifts')renderShifts();else if(S.tab==='open')renderOpen();else if(S.tab==='requests')renderRequests();else renderMore();
}
function shiftState(sh,now){
  if(sh.clock.out)return ['','Done'];if(sh.clock.in)return ['ok','On post'];
  if(sh.s<=now&&sh.e>now)return ['bad','Not clocked in'];if(sh.e<=now)return ['bad','Missed'];
  return sh.ack?['ok','Acknowledged']:['warn','Please acknowledge'];
}
function renderShifts(){
  const d=S.data,now=d.now,today=todayStr();const soon=new Date(Date.now()+90*60000);
  const groups=new Map();for(const sh of d.shifts){const k=sh.s.slice(0,10);(groups.get(k)||groups.set(k,[]).get(k)).push(sh);}
  let html='';if(!d.shifts.length)html='<div class="empty">No published shifts in the next two weeks.<br>Check the Open shifts tab, or call dispatch.</div>';
  for(const [day,list] of groups){const dt=parseLocal(day);
    html+=`<div class="day ${day===today?'today':''}">${day===today?'Today':day===addDays(today,1)?'Tomorrow':DAY[dt.getDay()]} · ${MON[dt.getMonth()]} ${dt.getDate()}</div>`;
    for(const sh of list){const [cls,txt]=shiftState(sh,now);const active=!sh.clock.out&&(sh.clock.in||(sh.s<=now&&sh.e>now)||(parseLocal(sh.s)<=soon&&sh.e>now));
      const canIn=!sh.clock.in&&parseLocal(sh.s)<=soon&&sh.e>now,canOut=sh.clock.in&&!sh.clock.out,future=sh.s>now;
      html+=`<div class="card ${active?'now':''}" data-shift="${sh.id}">
        <div><span class="pill ${cls}">${txt}</span>${sh.pos.armed?'<span class="pill warn">Armed</span>':''}${sh.clock.in&&sh.clock.in.flagged?'<span class="pill bad">Off-site clock-in</span>':''}${sh.pos.routeId?'<span class="pill info">Patrol</span>':''}${sh.pos.loneMinutes?'<span class="pill info">Lone worker</span>':''}</div>
        <div class="site" style="margin-top:6px">${esc(sh.site.name)}</div><div class="post">${esc(sh.pos.name)}</div>
        <div class="time">${t12(sh.s)} – ${t12(sh.e)}</div>
        <div class="meta">${sh.site.address?esc(sh.site.address)+' · ':''}${sh.site.phone?'<a href="tel:'+esc(sh.site.phone.replace(/[^\d+]/g,''))+'">'+esc(sh.site.phone)+'</a>':''}${sh.clock.in?' · in '+fmtAt(sh.clock.in.at):''}${sh.clock.out?' · out '+fmtAt(sh.clock.out.at):''}</div>
        ${sh.note?'<div class="msg info">'+esc(sh.note)+'</div>':''}
        ${(sh.site.postOrders||sh.pos.memo)?`<details><summary>Post orders</summary><div class="orders">${esc(sh.site.postOrders||'')}${sh.pos.memo?'\n\n'+esc(sh.pos.memo):''}</div></details>`:''}
        <div class="btns">
          ${!sh.ack&&!sh.clock.in?`<button class="btn" data-ack="${sh.id}">Acknowledge</button>`:''}
          ${canIn?`<button class="btn gold" data-clock="in" data-id="${sh.id}">Clock in</button>`:''}
          ${canOut?`<button class="btn primary" data-clock="out" data-id="${sh.id}">Clock out</button>`:''}
          ${sh.site.address?`<a class="btn small" href="https://maps.google.com/?q=${encodeURIComponent(sh.site.address)}" target="_blank" rel="noopener">Map</a>`:''}
        </div>
        ${active||sh.clock.in?`<div class="btns" style="margin-top:8px">
          <button class="btn small" data-cp="${sh.id}">Checkpoints</button>
          ${sh.pos.routeId?`<button class="btn small" data-rs="${sh.id}">Runsheet</button>`:''}
          <button class="btn small" data-report="daily" data-id="${sh.id}">Daily report</button>
          <button class="btn small danger" data-report="incident" data-id="${sh.id}">Incident</button></div>`:''}
        ${future&&!sh.clock.in?`<div class="btns" style="margin-top:8px"><button class="btn small" data-drop="${sh.id}">Can't make it</button><button class="btn small" data-swap="${sh.id}">Swap with someone</button></div>`:''}
      </div>`;}}
  $('#main').innerHTML=html;
}
async function renderOpen(){
  $('#main').innerHTML='<div class="empty">Loading open shifts…</div>';
  try{S.open=await api('GET','/api/officer/open');S.reqs=await api('GET','/api/officer/requests');}catch(e){$('#main').innerHTML='<div class="msg bad">'+esc(e.message)+'</div>';return;}
  const pend=S.reqs.requests.filter(r=>r.status==='pending');
  let html=`<h2>Open shifts · next 2 weeks</h2>`;
  if(!S.open.shifts.length)html+='<div class="empty">Nothing open right now. Check back later.</div>';
  for(const sh of S.open.shifts){html+=`<div class="card"><div>${sh.eligible?'<span class="pill ok">You qualify</span>':sh.reasons.map(r=>'<span class="pill bad">'+esc(r)+'</span>').join('')}${sh.ot?'<span class="pill warn">Would be overtime</span>':''}${sh.pos.armed?'<span class="pill warn">Armed</span>':''}</div>
    <div class="site" style="margin-top:6px">${esc(sh.site.name)}</div><div class="post">${esc(sh.pos.name)}</div><div class="time">${fmtDate(sh.s.slice(0,10))} · ${t12(sh.s)} – ${t12(sh.e)}</div>
    <div class="meta">${esc(sh.site.address||'')} · would bring you to ${sh.projected} h this week</div>
    <div class="btns">${sh.requested?'<span class="pill info" style="align-self:center">Requested — waiting for dispatch</span>':sh.eligible?`<button class="btn gold" data-pickup="${sh.id}">Request this shift</button>`:''}</div></div>`;}
  if(pend.length)html+=`<h2>Your pending requests</h2><div class="list">${pend.map(r=>`<div class="item"><div><div class="t">${r.kind==='pickup'?'Pick up':r.kind==='drop'?'Drop':'Swap'} · ${esc(r.shift?r.shift.label:'')}</div><div class="s">${r.note?esc(r.note)+' · ':''}sent ${fmtAt(r.at)}</div></div><button class="btn small" data-cancel-req="${r.id}">Cancel</button></div>`).join('')}</div>`;
  $('#main').innerHTML=html;
}
async function renderRequests(){
  $('#main').innerHTML='<div class="empty">Loading…</div>';
  try{S.reqs=await api('GET','/api/officer/requests');}catch(e){$('#main').innerHTML='<div class="msg bad">'+esc(e.message)+'</div>';return;}
  const stat=s=>`<span class="pill ${s==='approved'?'ok':s==='declined'?'bad':s==='pending'?'warn':''}">${s}</span>`;
  $('#main').innerHTML=`<h2>Request time off</h2><div class="card"><form id="tof"><div class="row2"><div class="field"><label>From</label><input type="date" name="from" required min="${todayStr()}"></div><div class="field"><label>To</label><input type="date" name="to" min="${todayStr()}"></div></div><div class="field"><label>Reason (optional)</label><input name="note" placeholder="Vacation, appointment…"></div><button class="btn primary" type="submit" style="width:100%">Send request</button></form></div>
  <h2>Time off</h2><div class="list">${S.reqs.timeOff.map(r=>`<div class="item"><div><div class="t">${r.from_date}${r.to_date!==r.from_date?' → '+r.to_date:''}</div><div class="s">${esc(r.note||'')}${r.decision_note?' · '+esc(r.decision_note):''}</div></div><div>${stat(r.status)}${r.status==='pending'?`<button class="btn small" data-cancel-to="${r.id}">Cancel</button>`:''}</div></div>`).join('')||'<div class="empty">No time-off requests yet.</div>'}</div>
  <h2>Shift requests</h2><div class="list">${S.reqs.requests.map(r=>`<div class="item"><div><div class="t">${r.kind==='pickup'?'Pick up':r.kind==='drop'?'Drop':'Swap'}${r.target?' with '+esc(r.target):''}</div><div class="s">${esc(r.shift?r.shift.label:'')}${r.decision_note?' · '+esc(r.decision_note):''}</div></div><div>${stat(r.status)}${r.status==='pending'?`<button class="btn small" data-cancel-req="${r.id}">Cancel</button>`:''}</div></div>`).join('')||'<div class="empty">No shift requests yet.</div>'}</div>`;
  $('#tof').addEventListener('submit',async e=>{e.preventDefault();const f=e.target;try{const r=await api('POST','/api/officer/timeoff',{from:f.from.value,to:f.to.value||f.from.value,note:f.note.value});toast(r.conflicts?`Sent. Dispatch will need to cover ${r.conflicts} shift${r.conflicts>1?'s':''}.`:'Request sent');renderRequests();}catch(err){toast(err.message);}});
}
function renderMore(){
  const e=S.data.employee;
  $('#main').innerHTML=`<div class="card"><div class="site">${esc(e.name)}</div><div class="post">${esc(e.title||'')}${e.customId?' · #'+esc(e.customId):''}</div><div class="meta">${esc(e.phone||'')}${e.email?' · '+esc(e.email):''}</div></div>
  <div class="list"><button class="btn" data-more="avail" style="text-align:left">🗓 My availability<div class="s" style="font-weight:400;font-size:13px;color:var(--muted)">Tell dispatch when you cannot work</div></button>
  <button class="btn" data-more="reports" style="text-align:left">📝 My reports<div class="s" style="font-weight:400;font-size:13px;color:var(--muted)">Daily and incident reports you have filed</div></button>
  <button class="btn" data-more="report-site" style="text-align:left">🚨 Report an incident (no shift)<div class="s" style="font-weight:400;font-size:13px;color:var(--muted)">For something seen off-shift at a site</div></button>
  <button class="btn" data-more="notes" style="text-align:left">🔔 Notifications</button></div>
  <h2>Licences &amp; training</h2><div>${(e.skills||[]).map(k=>`<span class="pill ${k.st==='EXPIRED'?'bad':k.st==='EXPIRING_SOON'?'warn':''}">${esc(k.n)}${k.exp?' · '+k.exp:''}</span>`).join('')||'<span class="meta">None on file.</span>'}</div>`;
}

/* ---------- sheets ---------- */
function sheet(title,html){const s=document.createElement('div');s.className='sheet';s.innerHTML=`<div class="bar"><h3>${esc(title)}</h3><button data-close>✕</button></div><div class="in">${html}</div>`;document.body.appendChild(s);s.querySelector('[data-close]').onclick=()=>{s.remove();stopCamera();};return s;}
const closeSheets=()=>{document.querySelectorAll('.sheet').forEach(s=>s.remove());stopCamera();};
const shiftById=id=>S.data.shifts.find(s=>s.id===id);

async function openCheckpoints(shiftId){
  const sh=shiftById(shiftId);let d;try{d=await api('GET',`/api/officer/shifts/${shiftId}/checkpoints`);}catch(e){return toast(e.message);}
  const s=sheet('Checkpoints · '+sh.site.name,`<div class="msg ${d.expected&&d.done>=d.expected?'ok':'info'}">${d.expected?`${d.done} of ${d.expected} scans done this shift`:`${d.done} scan${d.done===1?'':'s'} this shift`}${d.tours.length?' · '+d.tours.map(t=>esc(t.name)+' ×'+t.perShift).join(', '):''}</div>
    ${d.checkpoints.length?`<div class="list">${d.checkpoints.map(c=>`<div class="item"><div><div class="t">${esc(c.name)}</div><div class="s">${esc(c.instructions||'')}</div></div><div><span class="pill ${c.scans?'ok':''}">${c.scans} scan${c.scans===1?'':'s'}</span></div></div>`).join('')}</div>`:'<div class="empty">This site has no checkpoints set up.</div>'}
    <div class="btns"><button class="btn gold" id="scanqr">Scan QR code</button><button class="btn" id="entercode">Enter code</button></div>
    <div id="scanarea"></div>`);
  s.querySelector('#scanqr').onclick=()=>startCamera(s.querySelector('#scanarea'),async code=>{await doScan(shiftId,{code,method:'qr'});s.remove();openCheckpoints(shiftId);});
  s.querySelector('#entercode').onclick=async()=>{const code=prompt('Checkpoint code (printed under the QR):');if(!code)return;try{await doScan(shiftId,{code:code.trim(),method:'code'});s.remove();openCheckpoints(shiftId);}catch(e){toast(e.message);}};
}
async function doScan(shiftId,body){const pos=await geo();const r=await api('POST','/api/officer/scan',{shiftId,lat:pos?.latitude,lng:pos?.longitude,...body});toast('Scanned: '+r.checkpoint+(r.instructions?' — '+r.instructions:''));return r;}
let camStream=null,camTimer=null;
function stopCamera(){if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null;}if(camTimer){clearInterval(camTimer);camTimer=null;}}
async function startCamera(host,onCode){
  stopCamera();
  if(!('BarcodeDetector' in window)){host.innerHTML='<div class="msg warn">This phone\'s browser cannot read QR codes directly. Use "Enter code" and type the code printed under the QR.</div>';return;}
  try{camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});}catch(e){host.innerHTML='<div class="msg bad">Camera permission is needed to scan. Use "Enter code" instead.</div>';return;}
  host.innerHTML='<video autoplay playsinline muted></video><div class="msg info">Point the camera at the checkpoint QR code.</div>';const v=host.querySelector('video');v.srcObject=camStream;
  const det=new BarcodeDetector({formats:['qr_code']});
  camTimer=setInterval(async()=>{try{const codes=await det.detect(v);if(codes.length){const raw=codes[0].rawValue||'';stopCamera();try{await onCode(raw.replace(/^GP:/i,''));}catch(e){toast(e.message);}}}catch(e){}},600);
}
function openReport(kind,shiftId,siteId){
  const sh=shiftId?shiftById(shiftId):null;const photos=[];
  const fields=kind==='incident'?`<div class="field"><label>Type</label><select name="type"><option>Trespass</option><option>Theft</option><option>Vandalism</option><option>Disturbance</option><option>Medical</option><option>Fire / alarm</option><option>Property damage</option><option>Suspicious activity</option><option>Vehicle</option><option>Other</option></select></div>
    <div class="row2"><div class="field"><label>Time it happened</label><input type="time" name="time" value="${pad(new Date().getHours())}:${pad(new Date().getMinutes())}"></div><div class="field"><label>Location on site</label><input name="location" placeholder="Rear lot, lobby…"></div></div>
    <div class="field"><label>What happened</label><textarea name="description" rows="5" required placeholder="Who, what, when, where. Be specific."></textarea></div>
    <div class="field"><label>People involved / witnesses</label><input name="people"></div>
    <div class="field"><label>Action taken</label><textarea name="actions" rows="2" placeholder="Called police, asked to leave, notified client…"></textarea></div>
    <div class="row2"><div class="field"><label>Police / fire / EMS called?</label><select name="emergency"><option>No</option><option>Police</option><option>Fire</option><option>EMS</option><option>Multiple</option></select></div><div class="field"><label>Client notified?</label><select name="clientNotified"><option>No</option><option>Yes</option></select></div></div>`
  :`<div class="field"><label>Summary of the shift</label><textarea name="summary" rows="4" required placeholder="Patrols completed, doors checked, visitors, anything unusual."></textarea></div>
    <div class="field"><label>Issues found (maintenance, safety, equipment)</label><textarea name="issues" rows="2"></textarea></div>
    <div class="field"><label>Visitors / contractors on site</label><input name="visitors"></div>
    <div class="field"><label>Pass-down for the next officer</label><input name="passdown"></div>`;
  const s=sheet(kind==='incident'?'Incident report':'Daily activity report',`<div class="msg info">${sh?esc(sh.site.name)+' · '+esc(sh.pos.name)+' · '+fmtDate(sh.s.slice(0,10)):'Off-shift report'}</div>
    <form id="rf">${!sh?`<div class="field"><label>Site</label><select name="siteId" id="sitesel" required><option value="">Loading…</option></select></div>`:''}${fields}
    <div class="field"><label>Photos</label><div class="photos" id="ph"></div><input type="file" accept="image/*" capture="environment" id="phin" style="display:none"><button type="button" class="btn small" id="addph">📷 Add photo</button></div>
    <button class="btn primary" type="submit" style="width:100%">Submit report</button></form>`);
  if(!sh){api('GET','/api/officer/shifts').then(d=>{const sites=new Map();for(const x of d.shifts)sites.set(x.site.id,x.site.name);s.querySelector('#sitesel').innerHTML='<option value="">Choose a site…</option>'+[...sites].map(([id,n])=>`<option value="${id}">${esc(n)}</option>`).join('');});}
  s.querySelector('#addph').onclick=()=>s.querySelector('#phin').click();
  s.querySelector('#phin').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const data=await shrink(f);const r=await api('POST','/api/officer/photos',{data,name:f.name,siteId:sh?sh.site.id:undefined});photos.push(r.id);const img=document.createElement('img');img.src=r.url;s.querySelector('#ph').appendChild(img);}catch(err){toast(err.message);}e.target.value='';});
  s.querySelector('#rf').addEventListener('submit',async e=>{e.preventDefault();const f=e.target;const fields={};for(const el of f.elements){if(el.name&&el.name!=='siteId')fields[el.name]=el.value;}
    try{await api('POST','/api/officer/reports',{kind,shiftId:sh?sh.id:undefined,siteId:sh?undefined:f.siteId.value,fields,photos});toast('Report sent to dispatch');s.remove();}catch(err){toast(err.message);}});
}
function shrink(file){return new Promise((res,rej)=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{const max=1280;let w=img.width,h=img.height;if(w>max||h>max){if(w>h){h=Math.round(h*max/w);w=max;}else{w=Math.round(w*max/h);h=max;}}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.82));};img.onerror=rej;img.src=url;});}
async function openMyReports(){let d;try{d=await api('GET','/api/officer/reports');}catch(e){return toast(e.message);}
  sheet('My reports',`<div class="list">${d.reports.map(r=>`<div class="item"><div><div class="t">${esc(r.title)}</div><div class="s">${esc(r.site)} · ${fmtDate(r.at.slice(0,10))} ${fmtAt(r.at)}${r.photos.length?' · '+r.photos.length+' photo(s)':''}</div></div><span class="pill ${r.status==='sent'?'ok':r.status==='reviewed'?'info':''}">${r.status}</span></div>`).join('')||'<div class="empty">No reports yet.</div>'}</div>`);}
function openAvailability(){
  const e=S.data.employee;const avail=(e.avail||[]).map(a=>({...a}));const secT=s=>pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60));
  const s=sheet('My availability','');
  const draw=()=>{s.querySelector('.in').innerHTML=`<div class="msg info">Everything not listed here counts as available. Add the times you cannot work.</div>
    ${[0,1,2,3,4,5,6].map(d=>`<h2>${DAY[d]}</h2>${avail.filter(a=>a.d===d).map((a,i)=>`<div class="slot"><b style="flex:1">${a.f===0&&a.t>=86400?'All day':secT(a.f)+' – '+secT(a.t)}</b><span class="pill ${a.a==='N'?'bad':'warn'}">${a.a==='N'?'Unavailable':'Maybe'}</span><button class="btn small" data-rm="${d}|${i}">Remove</button></div>`).join('')||'<div class="meta">Available all day</div>'}`).join('')}
    <h2>Add a blocked time</h2><div class="card"><div class="row2"><div class="field"><label>Day</label><select id="ad">${DAY.map((d,i)=>`<option value="${i}">${d}</option>`).join('')}</select></div><div class="field"><label>Type</label><select id="aa"><option value="N">Unavailable</option><option value="M">Maybe</option></select></div></div><div class="row2"><div class="field"><label>From</label><input type="time" id="af" value="00:00"></div><div class="field"><label>To</label><input type="time" id="at" value="23:59"></div></div><button class="btn" id="addslot">Add</button></div>
    <button class="btn primary" id="saveav" style="width:100%;margin-top:12px">Save availability</button>`;
    s.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{const [d,i]=b.dataset.rm.split('|').map(Number);const rows=avail.filter(a=>a.d===d);const target=rows[i];avail.splice(avail.indexOf(target),1);draw();});
    s.querySelector('#addslot').onclick=()=>{const d=+s.querySelector('#ad').value,f=s.querySelector('#af').value,t=s.querySelector('#at').value;const fs=+f.slice(0,2)*3600+ +f.slice(3,5)*60;let ts=+t.slice(0,2)*3600+ +t.slice(3,5)*60;if(t==='23:59')ts=86400;if(ts<=fs)return toast('End must be after start');avail.push({d,f:fs,t:ts,a:s.querySelector('#aa').value});draw();};
    s.querySelector('#saveav').onclick=async()=>{try{const r=await api('PUT','/api/officer/availability',{avail});S.data.employee.avail=r.avail;toast('Availability saved');s.remove();}catch(err){toast(err.message);}};};
  draw();
}
function openNotes(){sheet('Notifications',`<div class="list">${S.notes.notifications.map(n=>`<div class="item ${n.read_at?'':'unread'}"><div><div class="t">${esc(n.text)}</div><div class="s">${fmtDate(n.at.slice(0,10))} ${fmtAt(n.at)}</div></div></div>`).join('')||'<div class="empty">Nothing yet.</div>'}</div>`);if(S.notes.unread){api('POST','/api/notifications/read').then(loadNotes);}}
async function openRunsheet(shiftId){
  let d;try{d=await api('GET',`/api/officer/shifts/${shiftId}/runsheet`);}catch(e){return toast(e.message);}
  const rs=d.runsheet;if(!rs)return toast('No route is assigned to this post');S.runsheet=rs;S.rsShift=shiftId;
  const s=sheet('Runsheet · '+rs.route.name,'');
  const draw=(rs)=>{S.runsheet=rs;s.querySelector('.in').innerHTML=`<div class="msg ${rs.status==='done'?'ok':rs.status==='active'?'info':'warn'}">${rs.status==='planned'?'Not started. Tap Start when you leave the yard.':rs.status==='active'?`On the road · ${rs.done} of ${rs.total} visits done${rs.missed?' · '+rs.missed+' missed':''}`:`Finished · ${rs.done} of ${rs.total} visits`}${rs.route.vehicle?' · '+esc(rs.route.vehicle):''}</div>
    ${rs.status==='planned'?'<button class="btn gold" id="rsstart" style="width:100%">Start runsheet</button>':''}
    ${rs.stops.map(st=>{const cur=rs.next&&rs.next.index===st.index;const v=st.visits.find(x=>x.status==='pending'||(x.arrivedAt&&!x.departedAt));return `<div class="card ${cur?'now':''}"><div>${st.visits.map(x=>`<span class="pill ${x.status==='ok'?'ok':x.status==='late'?'warn':x.status==='missed'?'bad':x.status==='skipped'?'':'info'}">${x.arrivedAt?fmtAt(x.arrivedAt):x.status}</span>`).join('')}</div>
      <div class="site" style="margin-top:6px">${st.index+1}. ${esc(st.site)}</div><div class="meta">${esc(st.address||'')}${st.windowFrom||st.windowTo?' · window '+(st.windowFrom||'')+'–'+(st.windowTo||''):''}</div>${st.instructions?'<div class="orders">'+esc(st.instructions)+'</div>':''}
      ${rs.status==='active'&&v?`<div class="btns">${!v.arrivedAt?`<button class="btn gold" data-arrive="${st.index}">Arrived</button><button class="btn small" data-skip="${st.index}">Skip</button>`:`<button class="btn primary" data-depart="${st.index}">Leaving — all clear</button><button class="btn small" data-depart="${st.index}" data-note="1">Leaving — with note</button>`}${st.address?`<a class="btn small" href="https://maps.google.com/?q=${encodeURIComponent(st.address)}" target="_blank" rel="noopener">Map</a>`:''}</div>`:''}</div>`;}).join('')}
    ${rs.status==='active'?'<div class="field"><label>End-of-run notes</label><textarea id="rsnotes" rows="2"></textarea></div><button class="btn danger" id="rsend" style="width:100%">Finish runsheet</button>':''}`;
    const upd=r=>draw(r.runsheet||r);
    const q=sel=>s.querySelector(sel);
    if(q('#rsstart'))q('#rsstart').onclick=async()=>{try{upd(await api('POST',`/api/officer/runsheets/${rs.id}/start`));startCrumbs(rs.id);}catch(e){toast(e.message);}};
    s.querySelectorAll('[data-arrive]').forEach(b=>b.onclick=async()=>{const pos=await geo();try{const r=await api('POST',`/api/officer/runsheets/${rs.id}/arrive`,{stopIndex:+b.dataset.arrive,lat:pos?.latitude,lng:pos?.longitude});if(r.late)toast('Logged — outside the time window');upd(r);}catch(e){toast(e.message);}});
    s.querySelectorAll('[data-depart]').forEach(b=>b.onclick=async()=>{let note='';if(b.dataset.note){note=prompt('What did you find?')||'';if(!note)return;}try{upd(await api('POST',`/api/officer/runsheets/${rs.id}/depart`,{stopIndex:+b.dataset.depart,note}));}catch(e){toast(e.message);}});
    s.querySelectorAll('[data-skip]').forEach(b=>b.onclick=async()=>{const note=prompt('Why are you skipping this stop?');if(!note)return;try{upd(await api('POST',`/api/officer/runsheets/${rs.id}/skip`,{stopIndex:+b.dataset.skip,note}));}catch(e){toast(e.message);}});
    if(q('#rsend'))q('#rsend').onclick=async()=>{if(!confirm('Finish the runsheet? Unvisited stops are marked missed.'))return;try{upd(await api('POST',`/api/officer/runsheets/${rs.id}/end`,{notes:q('#rsnotes').value}));stopCrumbs();toast('Runsheet finished. Patrol reports sent to dispatch.');}catch(e){toast(e.message);}};
  };
  draw(rs);if(rs.status==='active')startCrumbs(rs.id);
}
function startCrumbs(rsId){stopCrumbs();const send=async()=>{const p=await geo();if(p)api('POST',`/api/officer/runsheets/${rsId}/position`,{lat:p.latitude,lng:p.longitude}).catch(()=>{});};send();S.crumbTimer=setInterval(send,120000);}
function stopCrumbs(){if(S.crumbTimer){clearInterval(S.crumbTimer);S.crumbTimer=null;}}

/* ---------- lone worker banner ---------- */
async function pollLone(){
  if(!S.data)return;const active=S.data.shifts.find(sh=>sh.pos.loneMinutes&&sh.clock.in&&!sh.clock.out);
  const old=$('.checkin');if(!active){if(old)old.remove();return;}
  try{const st=await api('GET',`/api/officer/shifts/${active.id}/lone`);const due=st.active&&(st.overdue||new Date(st.nextDue)-Date.now()<2*60000);
    if(!due){if(old)old.remove();return;}if(old)return;
    const b=document.createElement('div');b.className='checkin';b.innerHTML=`<b>${st.overdue?'Check-in overdue':'Check-in due'} — are you OK?</b><button>I'm OK</button>`;
    b.querySelector('button').onclick=async()=>{const p=await geo();try{await api('POST',`/api/officer/shifts/${active.id}/checkin`,{lat:p?.latitude,lng:p?.longitude});b.remove();toast('Thanks — checked in');}catch(e){toast(e.message);}};document.body.appendChild(b);
    if(navigator.vibrate)navigator.vibrate([200,100,200]);}catch(e){}
}

/* ---------- clicks ---------- */
document.body.addEventListener('click',async e=>{
  const ack=e.target.closest('[data-ack]');if(ack){ack.disabled=true;try{await api('POST','/api/officer/shifts/'+ack.dataset.ack+'/ack');toast('Acknowledged');await load();}catch(err){toast(err.message);ack.disabled=false;}return;}
  const ck=e.target.closest('[data-clock]');if(ck){ck.disabled=true;ck.textContent='Getting location…';const pos=await geo();
    try{const r=await api('POST','/api/officer/shifts/'+ck.dataset.id+'/clock',{kind:ck.dataset.clock,lat:pos?.latitude,lng:pos?.longitude,accuracy:pos?.accuracy});toast(ck.dataset.clock==='in'?(r.flagged?'Clocked in — '+(r.note||'location flagged for dispatch'):'Clocked in. Have a safe shift.'):'Clocked out. Thanks.');await load();}catch(err){toast(err.message);await load();}return;}
  const cp=e.target.closest('[data-cp]');if(cp)return openCheckpoints(cp.dataset.cp);
  const rs=e.target.closest('[data-rs]');if(rs)return openRunsheet(rs.dataset.rs);
  const rp=e.target.closest('[data-report]');if(rp)return openReport(rp.dataset.report,rp.dataset.id);
  const pk=e.target.closest('[data-pickup]');if(pk){const note=prompt('Note for dispatch (optional):')||'';pk.disabled=true;try{await api('POST','/api/officer/requests',{kind:'pickup',shiftId:pk.dataset.pickup,note});toast('Requested — dispatch will confirm');renderOpen();}catch(err){toast(err.message);pk.disabled=false;}return;}
  const dr=e.target.closest('[data-drop]');if(dr){const note=prompt('Tell dispatch why you cannot make it:');if(!note)return;try{await api('POST','/api/officer/requests',{kind:'drop',shiftId:dr.dataset.drop,note});toast('Sent to dispatch');}catch(err){toast(err.message);}return;}
  const sw=e.target.closest('[data-swap]');if(sw){try{const c=await api('GET','/api/officer/colleagues');const s=sheet('Swap with…',`<div class="field"><label>Officer taking the shift</label><select id="swapwho">${c.officers.filter(o=>o.id!==S.user.employeeId).map(o=>`<option value="${o.id}">${esc(o.name)}</option>`).join('')}</select></div><div class="field"><label>Note</label><input id="swapnote" placeholder="They agreed on the phone…"></div><button class="btn primary" id="swapgo" style="width:100%">Send swap request</button>`);
    s.querySelector('#swapgo').onclick=async()=>{try{await api('POST','/api/officer/requests',{kind:'swap',shiftId:sw.dataset.swap,targetEmployeeId:s.querySelector('#swapwho').value,note:s.querySelector('#swapnote').value});toast('Swap request sent');s.remove();}catch(err){toast(err.message);}};}catch(err){toast(err.message);}return;}
  const cr=e.target.closest('[data-cancel-req]');if(cr){try{await api('DELETE','/api/officer/requests/'+cr.dataset.cancelReq);toast('Cancelled');render();}catch(err){toast(err.message);}return;}
  const ct=e.target.closest('[data-cancel-to]');if(ct){try{await api('DELETE','/api/officer/timeoff/'+ct.dataset.cancelTo);toast('Cancelled');renderRequests();}catch(err){toast(err.message);}return;}
  const mo=e.target.closest('[data-more]');if(mo){const k=mo.dataset.more;if(k==='avail')openAvailability();else if(k==='reports')openMyReports();else if(k==='report-site')openReport('incident',null);else if(k==='notes')openNotes();return;}
  if(e.target.closest('#bell'))return openNotes();
});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
start();
</script>
